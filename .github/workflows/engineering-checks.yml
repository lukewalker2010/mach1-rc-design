name: Engineering checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analysis and measurement regression tests
        run: python -m unittest discover -s tests -v
      - name: Publish current design screening (physical failures are expected)
        run: python tools/design_checks.py --json > design-screening.json
      - uses: actions/upload-artifact@v4
        with:
          name: design-screening
          path: design-screening.json
